          </defs>
          <rect width="100" height="100" rx="24" fill="url(#blBg)"/>
          <g transform="rotate(-35 50 50)">
            <rect x="9" y="46" width="82" height="8" rx="4" fill="url(#blSt)"/>
            <rect x="22" y="29.0" width="6" height="42" rx="3.0" fill="#f2c230"/><rect x="22" y="29.0" width="6" height="42" rx="3.0" fill="url(#blSh)"/>

            <rect x="64" y="23.0" width="7" height="54" rx="3.5" fill="#2f6fe0"/><rect x="64" y="23.0" width="7" height="54" rx="3.5" fill="url(#blSh)"/>
            <rect x="72" y="29.0" width="6" height="42" rx="3.0" fill="#f2c230"/><rect x="72" y="29.0" width="6" height="42" rx="3.0" fill="url(#blSh)"/>
            <rect x="45.4" y="43" width="3.2" height="14" rx="1.5" fill="#d8dce8"/><rect x="51.4" y="43" width="3.2" height="14" rx="1.5" fill="#d8dce8"/>
          </g>
        </svg>
        <div>
          <h1 id="headerTitle">MiGymTrack</h1>
          <div class="subtitle" id="headerSubtitle"></div>
        </div>
      </div>
      <button class="header-btn" id="btnMore" aria-label="Más opciones">⚙️</button>
    </div>
  </header>

  <main id="viewRoot"></main>
</div>
