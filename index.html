<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MiGymTrack</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>

<div id="app">
  <header class="app-header">
    <div class="title-row">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="38" height="38">
        <div>
          <h1 id="headerTitle">MiGymTrack</h1>
          <div class="subtitle" id="headerSubtitle"></div>
        </div>
      </div>
      <button class="header-btn" id="btnMore" aria-label="Más opciones">⚙️</button>
    </div>
  </header>

  <main id="viewRoot"></main>
</div>

<nav class="bottom-nav">
  <button class="nav-btn" data-view="hoy" aria-label="Hoy">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span class="lbl">Hoy</span>
  </button>
  <button class="nav-btn" data-view="plan" aria-label="Plan">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M8 3v4M16 3v4M3 10.5h18"/></svg>
    <span class="lbl">Plan</span>
  </button>
  <button class="nav-btn" data-view="calorias" aria-label="Calorías">
    <svg viewBox="0 0 24 24"><path d="M12 3c.6 3.2 4.5 4.8 4.5 9.2a4.5 4.5 0 0 1-9 0c0-1.9.9-3.1 1.8-4 .2 1.2.9 1.9 1.7 2C11 8.4 10.9 5.4 12 3z"/></svg>
    <span class="lbl">Calorías</span>
  </button>
  <button class="nav-btn" data-view="progreso" aria-label="Progreso">
    <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-5 3.5 3L20 6.5"/></svg>
    <span class="lbl">Progreso</span>
  </button>
  <button class="nav-btn" data-view="mas" aria-label="Más">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    <span class="lbl">Más</span>
  </button>
</nav>

<script src="js/lib/xlsx.full.min.js?v=5"></script>
<script src="js/db.js?v=5"></script>
<script src="js/utils.js?v=5"></script>
<script src="js/metrics.js?v=5"></script>
<script src="js/timer.js?v=5"></script>
<script src="js/modal.js?v=5"></script>
<script src="js/nutrition.js?v=5"></script>
<script src="js/excelBackup.js?v=5"></script>
<script src="js/views/today.js?v=5"></script>
<script src="js/views/plan.js?v=5"></script>
<script src="js/views/workout.js?v=5"></script>
<script src="js/views/calories.js?v=5"></script>
<script src="js/views/measurements.js?v=5"></script>
<script src="js/views/stats.js?v=5"></script>
<script src="js/views/progress.js?v=5"></script>
<script src="js/views/more.js?v=5"></script>
<script src="js/views/calculator.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
